[project]
name = "ev-pulse"
version = "0.1.0"
description = "Electric vehicle charging prediction and analysis platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.127.0",
    "holidays>=0.87",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "streamlit>=1.52.2",
    "tqdm>=4.67.1",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.1.0",
    "scikit-learn>=1.3.2",
    "mlflow>=3.8.0",
]
dashboard = [
    "streamlit>=1.52.2",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.7.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
