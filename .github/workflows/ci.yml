name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff (Code quality)
        run: uv run ruff check .
      
      - name: Format Check (Code formatting validation)
        run: uv run ruff format --check .

      - name: Run Tests
        run: uv run pytest