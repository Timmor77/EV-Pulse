name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff (Qualité du code)
        run: uv run ruff check .
      
      - name: Format Check (Vérifie si le code est beau)
        run: uv run ruff format --check .

      # On désactive les tests pour l'instant car on n'en a pas écrit
      # - name: Run Tests
      #   run: uv run pytest