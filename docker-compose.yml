services:
  # Service 1: The Intelligence (API)
  api:
    build: .
    container_name: ev-pulse-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Mount models to avoid rebuilding the image when retraining
      - ./src/models:/app/src/models

  # Service 2: The Interface (Dashboard)
  dashboard:
    build: .
    container_name: ev-pulse-dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # This tells the Dashboard: "The API is not on localhost, it's on 'api'"
      - API_URL=http://api:8000
    depends_on:
      - api
